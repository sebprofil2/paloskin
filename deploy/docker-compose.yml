# Betrieb auf dem Hetzner-Server: Next.js-App (nur intern erreichbar) plus Caddy als Reverse-Proxy mit HTTPS.
# Start:  docker compose -f deploy/docker-compose.yml up -d --build
# Umgebungsvariablen: /etc/paloskin/paloskin.env (root, 0600), Vorlage deploy/paloskin.env.example
# Dienstkontoschlüssel: /etc/paloskin/service-account.json (root, 0600), als Compose-Secret eingebunden

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /etc/paloskin/paloskin.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google_service_account
    secrets:
      - google_service_account
    # Kein "ports": der App-Port bleibt im internen Docker-Netz. Veröffentlichte Docker-Ports würden UFW umgehen.
    expose:
      - "3000"
    networks:
      - intern
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=64m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/booking"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - intern
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  google_service_account:
    file: /etc/paloskin/service-account.json

networks:
  intern:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
