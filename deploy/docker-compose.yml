# Betrieb auf dem Hetzner-Server: Next.js-App (nur intern erreichbar) plus Caddy als Reverse-Proxy mit HTTPS.
# Das Image wird NICHT auf dem Server gebaut, sondern von GitHub Actions für linux/amd64 nach ghcr.io gelegt.
# Start:   docker compose -f deploy/docker-compose.yml pull && docker compose -f deploy/docker-compose.yml up -d
# Notfall-Build auf dem Server: zusätzlich -f deploy/docker-compose.build.yml und --build
# Umgebungsvariablen: /etc/paloskin/paloskin.env (root, 0600), Vorlage deploy/paloskin.env.example
# Dienstkontoschlüssel: /etc/paloskin/service-account.json, Eigentümer 10001:10001, Rechte 0400
#   (Compose übernimmt bei Datei-Secrets uid, gid und mode nicht; es gelten die Rechte der Datei auf dem Host)
# Buchungsdatenbank (Stufe 2): SQLite unter /var/lib/paloskin/buchung.sqlite auf dem Host, Verzeichnis 10001:10001 0700,
#   als einziges beschreibbares Verzeichnis eingebunden; der Container bleibt sonst schreibgeschützt.
# Testcontainer app-test (Profil test): Image eines Arbeitsbranches, eigene Datenbank unter /var/lib/paloskin-test,
#   erreichbar nur über neu.paloskin.de. Start: docker compose -f deploy/docker-compose.yml --profile test up -d app-test

services:
  app:
    image: ghcr.io/sebprofil2/paloskin:${PALOSKIN_IMAGE_TAG:-zonen}
    restart: unless-stopped
    env_file:
      - /etc/paloskin/paloskin.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google_service_account
      BOOKING_DB_PATH: /var/lib/paloskin/buchung.sqlite
      PUBLIC_BASE_URL: https://www.paloskin.de
    secrets:
      - google_service_account
    # Kein "ports": der App-Port bleibt im internen Docker-Netz. Veröffentlichte Docker-Ports würden UFW umgehen.
    expose:
      - "3000"
    networks:
      - intern
    user: "10001:10001"
    read_only: true
    volumes:
      - /var/lib/paloskin:/var/lib/paloskin
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=64m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 640m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/booking"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Testinstanz für neu.paloskin.de: gleicher Aufbau, anderes Image-Tag, eigene Datenbank. Läuft nur mit --profile test.
  # Eigene Umgebungsdatei /etc/paloskin/paloskin-test.env (nie die Datei der Produktion, Vorlage deploy/paloskin-test.env.example).
  # PALOSKIN_INSTANCE=test sorgt im Code dafür, dass nur TEST_CALENDAR_ID gelesen und beschrieben wird, jede Mail an
  # MAIL_REDIRECT_TO geht und „[TEST]“ im Betreff trägt; fehlt eines davon, verweigert die Instanz Buchungen (lib/instance.ts).
  app-test:
    image: ghcr.io/sebprofil2/paloskin:${PALOSKIN_TEST_TAG:-stufe2}
    profiles:
      - test
    restart: unless-stopped
    env_file:
      - /etc/paloskin/paloskin-test.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      PALOSKIN_INSTANCE: test
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google_service_account
      BOOKING_DB_PATH: /var/lib/paloskin-test/buchung.sqlite
      PUBLIC_BASE_URL: https://neu.paloskin.de
      # Die Testinstanz bleibt immer im Testbetrieb (Testcode, Testbalken, test: true)
      TEST_MODE: "true"
    secrets:
      - google_service_account
    expose:
      - "3000"
    networks:
      - intern
    user: "10001:10001"
    read_only: true
    volumes:
      - /var/lib/paloskin-test:/var/lib/paloskin-test
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=64m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/booking"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Endpunkt für das Kundensystem: nur an der privaten Adresse, nie an 2.31.2.192
      - "10.0.0.2:8443:8443"
    environment:
      INTERN_UPSTREAM: ${PALOSKIN_INTERN_UPSTREAM:-app:3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - intern
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  google_service_account:
    file: /etc/paloskin/service-account.json

networks:
  intern:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
