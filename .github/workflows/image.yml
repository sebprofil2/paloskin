# Baut das Container-Image für linux/amd64 außerhalb des Servers und legt es im GitHub Container Registry ab.
# Auslöser: Push auf zonen, stufe2 oder main, monatlich (frische Basis-Images und Sicherheitsupdates), von Hand.
name: Container-Image

on:
  push:
    branches: [zonen, stufe2, main]
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bauwerkzeug über Googles Spiegel von Docker Hub statt direkt von Docker Hub (Ausfall am 9. Oktober 2026)
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
