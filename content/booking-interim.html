.page{padding:8px 24px 32px;display:flex;flex-direction:column;gap:48px}

/* Kacheln: eckig, ruhig; gewählt = Ultramarin-Rahmen, keine Vollfläche */

.tiles.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}

.chip:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--ink)}
.chip[aria-pressed="true"]{background:var(--white);box-shadow:inset 0 0 0 2px var(--ultramarin)}

/* Felder: Kalk-2, Linie unten, Fokus Ultramarin unten */

.note a,.placeholder dd a{color:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ultramarin)}

.fallback{box-shadow:inset 0 0 0 1px var(--ink);padding:18px}
.fallback strong{font-weight:500}
.fallback .num{font-size:22px;font-variant-numeric:tabular-nums;user-select:all;margin:8px 0 12px;letter-spacing:.02em}
.btn-ghost{border:1px solid var(--ink);background:transparent;border-radius:0;padding:12px 18px;cursor:pointer;font-weight:500;font-size:16px}

.summary{border-top:1px solid var(--line)}
.summary .row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.summary .row span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.summary .head{font-size:15px;font-weight:500;color:var(--ink)}
.summary .total{font-weight:500}

/* Leiste unten: dünne Fortschrittslinie, ein Ultramarin-Knopf */
.bar{position:sticky;bottom:0;background:var(--kalk);border-top:1px solid var(--line);padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:16px}

.bar .sum{flex:1;min-width:0}
.bar .sum .k{font-size:13px;color:var(--ink-2)}
.bar .sum .v{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.primary{background:var(--ultramarin);color:var(--white);border:0;border-radius:0;padding:16px 24px;font-weight:500;font-size:17px;cursor:pointer;white-space:nowrap}
.bar .primary{flex:1}
.primary:hover{background:var(--ultramarin-hover)}

/* Bestätigung: Ultramarin-Vollfläche */
.confirm{background:var(--ultramarin);color:var(--white);padding:40px 24px 32px;display:flex;flex-direction:column;gap:14px}
.confirm h1{font-size:34px;line-height:1.15;letter-spacing:.02em}
.confirm p{margin:0;font-size:17px;opacity:.92}
.cal{display:grid;gap:8px;margin-top:10px}
.cal a,.cal button{display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,.7);background:transparent;color:var(--white);padding:14px 16px;font-weight:500;font-size:16px;text-decoration:none;cursor:pointer;border-radius:0}
.cal button{text-align:left}
.cal a:hover,.cal button:hover{background:rgba(255,255,255,.1)}
.cal .hint{color:var(--white);opacity:.85}
.after{padding:28px 24px 32px;display:flex;flex-direction:column;gap:20px}

/* Platzhalter bis 30.09. */


/* Sprachen: Zeile unter der Wortmarke, Fahnen klickbar */
.langs{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--kalk-2)}
.langs .say{font-size:15px;color:var(--ink-2)}

/* ---------- Version 17: drei Schritte, kompakter ---------- */
.brand{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px 14px}
.brand .wm{font-size:22px}
.brand .by{font-size:13px}
.lang{position:relative}
.lang-btn{display:flex;align-items:center;gap:8px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:transparent;padding:7px 10px;font-size:14px;cursor:pointer;white-space:nowrap}
.lang-btn:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.lang svg{width:20px;height:14px;display:block;box-shadow:0 0 0 1px rgba(29,31,34,.18);flex:none}
.chev{width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg);flex:none}
[aria-expanded="true"]>.chev{transform:translateY(2px) rotate(225deg)}
.lang-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--white);box-shadow:0 0 0 1px var(--line),0 12px 28px rgba(29,31,34,.12);min-width:230px;padding:6px}
.lang-say{font-size:13px;color:var(--ink-2);padding:8px 10px 6px;line-height:1.4}
.lang-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:10px;font-size:15px;cursor:pointer;text-align:left}
.lang-item:hover{background:var(--kalk-2)}
.lang-item[aria-checked="true"]{box-shadow:inset 2px 0 0 var(--ultramarin);font-weight:500}
.steps{display:flex;justify-content:space-between;gap:10px;padding:0 20px;border-bottom:1px solid var(--line)}
.st{flex:none;border:0;background:transparent;padding:12px 0 10px;font-size:14px;color:var(--ink-3);text-align:left;display:flex;align-items:center;gap:8px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;min-width:0;white-space:nowrap}
.st .num{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px currentColor;display:inline-grid;place-items:center;font-size:12px;flex:none}
.st.cur{color:var(--ink);border-bottom-color:var(--ultramarin);font-weight:500}
.st.cur .num{background:var(--ultramarin);color:var(--white);box-shadow:none}
.st:disabled{cursor:default}
.st:not(.cur):not(:disabled){color:var(--ink-2)}
.page{padding:22px 20px 64px;gap:24px}
.sec{gap:18px;padding-top:0;border-top:0}
.block{display:grid;gap:10px}
.lbl{font-size:15px;font-weight:500;color:var(--ink)}
h2{font-size:22px;line-height:1.25}
.seg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.segb{border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--white);padding:11px 12px;font-size:15px;line-height:1.3;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left}
.segb:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.segb::before{content:"";width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink-3);flex:none}
.segb[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--ultramarin)}
.segb[aria-checked="true"]::before{box-shadow:inset 0 0 0 5px var(--ultramarin)}
.opts{display:grid;gap:6px}
.opt{display:grid;grid-template-columns:18px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:var(--white);box-shadow:inset 0 0 0 1px var(--line);padding:12px 14px;cursor:pointer}
.opt:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.opt[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--ultramarin)}
.opt .t{font-weight:500;font-size:16px;line-height:1.3;display:block}
.opt .d{font-size:14px;color:var(--ink-2);line-height:1.35;display:block;margin-top:1px}
.opt .p{font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16px}
.opt .p small{font-weight:400;color:var(--ink-2);font-size:13px}
.ind{width:18px;height:18px;flex:none;box-shadow:inset 0 0 0 1.5px var(--ink-3);position:relative}
.ind.radio{border-radius:50%}
.opt[aria-checked="true"] .ind.radio{box-shadow:inset 0 0 0 5px var(--ultramarin)}
.opt[aria-checked="true"] .ind.checkbox{background:var(--ultramarin);box-shadow:none}
.opt[aria-checked="true"] .ind.checkbox::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--white);border-width:0 2px 2px 0;transform:rotate(45deg)}
.accw{box-shadow:inset 0 0 0 1px var(--line);background:var(--white)}
.accw.has{box-shadow:inset 0 0 0 2px var(--ultramarin)}
.acc{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:14px;cursor:pointer;text-align:left}
.acc .at{font-weight:500;font-size:16px;flex:1}
.acc .am{font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}

.accp{padding:0 14px 14px;display:grid;gap:10px}
.sub{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--ink-2);margin-top:4px}
.help{border:0;background:transparent;padding:0;color:var(--ultramarin);font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.extras{display:grid;gap:8px;padding:10px 12px;background:var(--kalk-2)}
.extras .sub{margin-top:0}
.extras .chip{background:var(--white)}
.addlink{justify-self:start;align-self:flex-start;border:0;background:transparent;padding:4px 0;color:var(--ultramarin);font-size:15px;cursor:pointer;font-weight:500}
textarea{min-height:72px}
.overview{background:var(--white);box-shadow:inset 0 0 0 1px var(--line);padding:12px 14px;display:grid;gap:8px}
.ov-h{font-size:13px;color:var(--ink-2)}
.ov-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;font-size:15px}
.ov-row+.ov-row{border-top:1px solid var(--line);padding-top:8px}
.ov-lines{display:grid;gap:2px;flex:1}
.ov-line{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.ov-line.total{font-weight:500;margin-top:4px}
.chg{border:0;background:transparent;padding:0;color:var(--ultramarin);font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;flex:none}
.days{margin-inline:-20px;padding-inline:20px}
.bar{gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.back{border:0;box-shadow:inset 0 0 0 1px var(--ink);background:transparent;padding:16px;font-size:16px;cursor:pointer;font-weight:500;flex:none}
.back:hover{background:var(--kalk-2)}
.primary{white-space:normal;line-height:1.3}
.refbox{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:16px}

.days{margin-inline:0;padding-inline:0}
.consentline{font-size:13px;color:var(--ink-3);line-height:1.5}
.seltext{white-space:pre-wrap;font:inherit;font-size:15px;line-height:1.5;margin:0;background:var(--white);box-shadow:inset 0 0 0 1px var(--line);padding:12px 14px}
.consentline a{color:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ultramarin)}
.homelink{display:block;text-align:center;font-size:14px;color:var(--ink-3);padding:18px 0 0;text-decoration:none}
.homelink:hover{color:var(--ink);text-decoration:underline}
.dur{font-size:14px;color:var(--ink-2)}
.bar .sum .k,.bar .sum .v{display:block}
.bar .sum .v{font-variant-numeric:normal}
/* Zonenauswahl: alle Zonen gleichwertig, Summe darunter (1. Oktober 2026) */
.zones{display:flex;flex-wrap:wrap;gap:8px}
.zones .chip{background:var(--white);padding:10px 14px;font-size:16px}
.zones .chip[aria-pressed="true"]{background:var(--white);box-shadow:inset 0 0 0 2px var(--ultramarin)}
.zones input[type=text]{background:var(--white);font-size:16px;flex-basis:100%}
.zsum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:16px;padding:10px 12px;background:var(--kalk-2)}
.zsum b{font-weight:500}
.zsum .zp{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.zsum small{display:block;font-weight:400;color:var(--ink-3);font-size:13px;line-height:1.4;margin-top:2px}

/* ---------- Breite begrenzen: Chrome rechnet die Mindestbreite umbrechender Kachelzeilen als Summe aller Kacheln ---------- */
.page>*,.sec>*,.block>*,.accp>*,.accw,.acc,.zones,.zsum,.opts,.opt{min-width:0;max-width:100%}
.accw{overflow:hidden}
/* Zonen-Kacheln: fester Rahmen von 2 Pixeln, beim Auswählen wechselt nur die Farbe, nichts springt */
.zones .chip{border:2px solid var(--line);box-shadow:none;background:var(--white);padding:8px 12px;font-size:16px;line-height:1.2}
.zones .chip:hover:not(:disabled){border-color:var(--ink);box-shadow:none}
.zones .chip[aria-pressed="true"]{border-color:var(--ultramarin);box-shadow:none;background:var(--white)}
</style>

function items(){

  if (n>0) out.push([l.botRow+l.zoneCountLabel(n)+": "+zoneNames(l).join(", "), zonePrice(n)]);

}

/* Dauer: erster Besuch 30, schon einmal da 20, Beratung immer 30, Botulinum plus Lachs-DNA 20 mehr, Kontrolle 15 */
function minutes(){
  if (mode==="checkup") return 15;
  if (s.beratung) return 30 + (s.persons-1)*20;
  if (!s.visit) return null;
  let m = s.visit==="return" ? 20 : 30;
  const botox = zoneN()>0 || s.zonesUnknown || s.kaumuskel || s.nefertiti || s.achsel;
  if (botox && s.lachs) m += 20;
  return m + (s.persons-1)*20;
}

function notes(){
  const de=T.de, rows=[];
  if (mode==="checkup") rows.push("Kontrolltermin");
  else rows.push(s.visit==="first" ? "Erster Besuch" : "Schon einmal da");
  if (s.persons===2) rows.push("Zu zweit (die Begleitung entscheidet vor Ort)");
  if (s.beratung) rows.push("Noch unsicher, Beratung gewünscht");
  if (zoneN()>0) rows.push("Botox: "+de.zoneCountLabel(zoneN())+": "+zoneNames(de).join(", ")+" ("+zonePrice(zoneN())+" € brutto)");
  else if (s.zonesUnknown) rows.push("Botox: Zonen noch offen");
  if (s.kaumuskel) rows.push("Botox: Kaumuskel ("+PRICES.kaumuskel+" € brutto)");
  if (s.nefertiti) rows.push("Botox: Nefertiti-Lift ("+PRICES.nefertiti+" € brutto)");
  if (s.achsel) rows.push("Botox: Übermäßiges Schwitzen (Hyperhidrose) ("+PRICES.achsel+" € brutto)");
  if (s.lachs) rows.push(s.lachs==="pack" ? "Skin Booster: Lachs-DNA Viererpaket ("+PRICES.lachsPack+" € brutto)" : "Skin Booster: Lachs-DNA, eine Behandlung ("+PRICES.lachs+" € brutto)");
  if (hasTreatment() && total()>0) rows.push("Summe voraussichtlich "+total()+" € brutto");
  if (s.note.trim()) rows.push("Notiz: "+s.note.trim());
  rows.push("Dauer geplant: "+minutes()+" Minuten");
  rows.push("Sprache: "+LANGS.find(x=>x.id===lang).name);
  return rows.join("\n");
}

const pad = n => String(n).padStart(2,"0");
function dayList(){
  const out=[]; const now=new Date();
  for (let i=1;i<=21 && out.length<14;i++){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);
    if (d.getDay()===0) continue; /* sonntags nicht */
    out.push({key:d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()), date:d});
  }
  return out;
}
const DAYS = dayList();
const dfmt = (d,o) => new Intl.DateTimeFormat(LOC(),o).format(d.date);
const cap = t => t.charAt(0).toUpperCase()+t.slice(1);
const dayWd = d => cap(dfmt(d,{weekday:"short"}).replace(/\.$/,""));
const dayLabel = d => cap(dfmt(d,{weekday:"long",day:"numeric",month:"long"}));
function field(id,label,type,extra=""){
  const inv = s.errors[id];
  return `<label class="field ${inv?"invalid":""}" for="${id}"><span class="l">${label}</span><input id="${id}" type="${type}" value="${esc(s.f[id])}" ${extra}>${inv?`<span class="err">${L()[inv]}</span>`:""}</label>`;
}
function stepSlot(){
  const l=L();
  const title = mode==="checkup" ? l.slotQCheckup : l.slotQ;
  const chk = mode==="checkup" ? `<div class="note"><strong>${l.checkupLbl}</strong>${l.checkupP}</div>` : "";
  const dayBtns = DAYS.map(d=>`<button type="button" class="day" data-day="${d.key}" aria-pressed="${d.key===s.day}" aria-label="${dayLabel(d)}"><div class="w">${dayWd(d)}</div><div class="n">${d.date.getDate()}</div></button>`).join("");
  const wins = l.wins.map((w,i)=>`<button type="button" class="chip" data-win="${i}" aria-pressed="${s.win===i}">${w}</button>`).join("");
  return `<section class="sec" id="sec-slot">${chk}<h2>${title}</h2>
    <p class="hint">${l.interim}</p>
    <div class="block" id="sec-day"><span class="lbl">${l.dayQ}</span>${miss("day")}
      <div class="days" role="group" aria-label="${l.dayAria}">${dayBtns}</div>
      <button type="button" class="chip" id="flex" aria-pressed="${s.flex}">${l.flex}</button>
    </div>
    <div class="block" id="sec-win"><span class="lbl">${l.winQ}</span>${miss("win")}<div class="chips">${wins}</div></div>
    <div class="block" id="sec-name"><span class="lbl">${l.nameH}</span>
      ${field("vorname",l.vorname,"text",'autocomplete="given-name"')}
      ${field("nachname",l.nachname,"text",'autocomplete="family-name"')}
    </div>
    <div class="block" id="sec-sel"><span class="lbl">${l.selH}</span>
      <pre class="seltext" id="seltext">${esc(selectionText())}</pre>
      <p class="hint">${l.selHint}</p>
      <button type="button" class="btn-ghost" id="copySel" style="align-self:flex-start">${l.copySel}</button>
    </div>
    <p class="consentline">${l.consentLine}</p>
    <a class="btn-ghost" style="text-decoration:none;display:inline-block;align-self:flex-start" id="smslink" href="#">${l.sms}</a>
    <div class="note"><strong>${l.cancelT}</strong>${l.cancelP}</div>
  </section>`;
}
/* Der WhatsApp- und SMS-Link enthält nur den neutralen Gruß, keine Angaben zur Person oder Behandlung */
function message(){ return L().msgHello; }
/* Auswahl des Kunden, wird auf der Seite angezeigt und kann in den Chat kopiert werden */
function selectionText(){
  const l=L(), de=T.de;
  const day = s.flex ? l.msgFlex : (s.day ? dayLabel(DAYS.find(d=>d.key===s.day)) : "");
  const win = s.win!=null ? l.wins[s.win] : "";
  const lines=[l.msgWish+": "+[day,win].filter(Boolean).join(", "), l.msgName+": "+(s.f.vorname.trim()+" "+s.f.nachname.trim()).trim(), ""];
  /* Auswahl auf Deutsch für das Studio */
  if (mode==="checkup") lines.push("Kontrolltermin");
  else lines.push(s.visit==="first" ? "Erster Besuch" : "Schon einmal da");
  if (s.persons===2) lines.push(l.persons2);
  if (s.beratung) lines.push("Noch unsicher, Beratung gewünscht");
  if (zoneN()>0) lines.push("Botox: "+de.zoneCountLabel(zoneN())+": "+zoneNames(de).join(", "));
  else if (s.zonesUnknown) lines.push("Botox: Zonen noch offen");
  if (s.kaumuskel) lines.push("Botox: Kaumuskel");
  if (s.nefertiti) lines.push("Botox: Nefertiti-Lift");
  if (s.achsel) lines.push("Botox: Übermäßiges Schwitzen (Hyperhidrose)");
  if (s.lachs) lines.push(s.lachs==="pack" ? "Skin Booster: Lachs-DNA Viererpaket" : "Skin Booster: Lachs-DNA, eine Behandlung");
  if (s.note.trim()) lines.push("Notiz: "+s.note.trim());
  lines.push("Sprache: "+LANGS.find(x=>x.id===lang).name);
  return lines.join("\n");
}
const waLink = () => WA+"?text="+encodeURIComponent(message());
const smsLink = () => SMS+"?&body="+encodeURIComponent(message());
function validateSlot(){
  const e={};
  if (!s.flex && !s.day) e.day="eDay";
  if (s.win==null) e.win="eWin";
  if (!s.f.vorname.trim()) e.vorname="eVorname";
  if (!s.f.nachname.trim()) e.nachname="eNachname";
  s.errors=e; return Object.keys(e);
}
function send(){
  const bad=validateSlot();
  if (bad.length){ render(); const el=document.getElementById({day:"sec-day",win:"sec-win"}[bad[0]]||bad[0]); if (el) el.scrollIntoView({behavior:"smooth",block:"center"}); return; }
  window.open(waLink(),"_blank","noopener");
}

function barHtml(){
  const l=L(), fs=firstStep();
  const pct = Math.round(100*(s.step-fs+1)/(2-fs+1));
  return `<div class="prog" aria-hidden="true"><span style="width:${pct}%"></span></div>`
    + (s.step>fs ? `<button class="back" id="back" type="button">${l.back}</button>` : "")
    + (s.step===1 ? `<button class="primary" id="next" type="button">${l.next1}</button>` : `<button class="primary" id="send" type="button">${l.send}</button>`);
}
function summaryLine(){
  const l=L();
  if (mode==="checkup") return l.checkupLbl;
  const parts = [];
  if (s.beratung) parts.push(l.unsureT);
  items().forEach(([n])=>parts.push(n));
  return parts.join(", ");
}

function render(keepScroll){
  document.documentElement.lang = lang;
  const hl=document.getElementById("homelink"); if (hl) hl.textContent = L().home;
  const body = s.step===1 ? stepTreat() : stepSlot();
  const y = window.scrollY;
  app.innerHTML = brand()+stepper()+`<div class="page">${body}</div><div class="bar" id="bar">${barHtml()}</div>`;
  if (keepScroll!==false) window.scrollTo(0,y);
  bind();
}
const toTop = () => { app.scrollIntoView({block:"start"}); };

function toggleTile(id){
  const clearT = () => { s.zoneIds=[]; s.otherOn=false; s.otherText=""; s.zonesUnknown=false; s.kaumuskel=s.nefertiti=s.achsel=false; s.lachs=null; };
  if (id==="v-first"||id==="v-return"){ s.visit = id==="v-first"?"first":"return"; delete s.errors.visit; }
  else if (id==="beratung"){ s.beratung=!s.beratung; if (s.beratung){ clearT(); s.open={bot:false,boost:false}; } delete s.errors.treat; }
  else {
    s.beratung=false; delete s.errors.treat;
    if (id==="lachs") s.lachs = s.lachs==="single"?null:"single";
    else if (id==="lachsPack") s.lachs = s.lachs==="pack"?null:"pack";
    else if (id in s) s[id]=!s[id];
  }
  render();
}

function validateStep(n){
  const e={};
  if (n===1){ if (!visitChosen()) e.visit="eVisit"; if (!treatmentChosen()) e.treat="eTreat"; }
  s.errors=e; return Object.keys(e);
}
const target = k => ({visit:"sec-visit",treat:"sec-treat"}[k]) || k;

function next(){
  const bad = validateStep(s.step);
  if (bad.length){
    render();
    const el=document.getElementById(target(bad[0]));
    if (el) el.scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  s.step=2; s.maxStep=2; render(false); toTop();
}
function goto(n){ s.step=n; s.errors={}; render(false); toTop(); }

function bindLangs(){
  const btn=document.getElementById("langBtn"); if(btn) btn.onclick=e=>{ e.stopPropagation(); langOpen=!langOpen; render(); };
  app.querySelectorAll("[data-lang]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); lang=b.dataset.lang; langOpen=false; P.saveLang(lang); render();
  });
}
document.addEventListener("click",e=>{ if (langOpen && !e.target.closest(".lang")){ langOpen=false; render(); } });

function bind(){
  bindLangs();
  const nx=document.getElementById("next"); if(nx) nx.onclick=next;
  const bk=document.getElementById("back"); if(bk) bk.onclick=()=>goto(Math.max(firstStep(),s.step-1));
  app.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>goto(Number(b.dataset.goto)));
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>toggleTile(b.dataset.t));
  app.querySelectorAll("[data-acc]").forEach(b=>b.onclick=()=>{ const k=b.dataset.acc; s.open[k]=!s.open[k]; render(); });
  const zh=document.getElementById("zoneHelp"); if(zh) zh.onclick=()=>{ s.zoneHelp=!s.zoneHelp; render(); };
  const na=document.getElementById("noteAdd"); if(na) na.onclick=()=>{ s.noteOpen=true; render(); const n=document.getElementById("note"); if(n) n.focus(); };
  app.querySelectorAll("[data-persons]").forEach(b=>b.onclick=()=>{ s.persons=Number(b.dataset.persons); render(); });
  app.querySelectorAll("[data-zone]").forEach(b=>b.onclick=()=>{ const z=b.dataset.zone; s.zoneIds = s.zoneIds.includes(z) ? s.zoneIds.filter(x=>x!==z) : [...s.zoneIds,z]; s.zonesUnknown=false; s.beratung=false; delete s.errors.treat; render(); });
  const oc=document.getElementById("otherChip"); if(oc) oc.onclick=()=>{ s.otherOn=!s.otherOn; if(!s.otherOn) s.otherText=""; s.zonesUnknown=false; s.beratung=false; delete s.errors.treat; render(); const t=document.getElementById("otherText"); if(t) t.focus({preventScroll:true}); };
  const uc=document.getElementById("unknownChip"); if(uc) uc.onclick=()=>{ s.zonesUnknown=!s.zonesUnknown; if(s.zonesUnknown){ s.zoneIds=[]; s.otherOn=false; s.otherText=""; } s.beratung=false; delete s.errors.treat; render(); };
  const ot=document.getElementById("otherText"); if(ot) ot.oninput=()=>{ s.otherText=ot.value; };
  const note=document.getElementById("note"); if(note) note.oninput=()=>{ s.note=note.value; };
  const sd=document.getElementById("send"); if(sd) sd.onclick=send;
  app.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ s.day=b.dataset.day; s.flex=false; delete s.errors.day; render(); });
  const fx=document.getElementById("flex"); if(fx) fx.onclick=()=>{ s.flex=!s.flex; if (s.flex) s.day=null; delete s.errors.day; render(); };
  app.querySelectorAll("[data-win]").forEach(b=>b.onclick=()=>{ s.win=Number(b.dataset.win); delete s.errors.win; render(); });
  ["vorname","nachname"].forEach(id=>{ const el=document.getElementById(id); if(el) el.oninput=()=>{ s.f[id]=el.value; const st=document.getElementById("seltext"); if (st) st.textContent=selectionText(); }; });
  const cs=document.getElementById("copySel"); if(cs) cs.onclick=()=>{
    const done=()=>{ cs.textContent=L().copied; };
    const fallback=()=>{ const r=document.createRange(); r.selectNodeContents(document.getElementById("seltext")); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); cs.textContent=L().marked; };
    try{ navigator.clipboard.writeText(selectionText()).then(done,fallback); }catch(e){ fallback(); }
  };
  const sl=document.getElementById("smslink"); if(sl){ sl.href=smsLink(); sl.onclick=e=>{ if (validateSlot().length){ e.preventDefault(); render(); } }; }
  const copy=document.getElementById("copy"); if(copy) copy.onclick=()=>{
    const done=()=>{ copy.textContent=L().copied; };
    const fallback=()=>{ const r=document.createRange(); r.selectNodeContents(document.getElementById("num")); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); copy.textContent=L().marked; };
    try{ navigator.clipboard.writeText(PHONE).then(done,fallback); }catch(e){ fallback(); }
  };
}

render(false);
})();
</script>
</body>
</html>
